# Routes the three Supabase API surfaces the app uses onto one origin, which
# is what NEXT_PUBLIC_SUPABASE_URL points at.
#
# nginx rather than Kong on purpose: GoTrue, PostgREST and storage-api each
# validate the JWT themselves, so the gateway only needs to route and handle
# CORS.
#
# CORS matters here: the browser runs on :3000 and this gateway is :8000, so
# every client-side call is cross-origin. storage-api implements no OPTIONS
# route at all — it 404s the preflight, which the browser surfaces as the
# useless "Failed to fetch". Kong does this job in a stock Supabase stack;
# here the gateway must.

map $http_origin $cors_origin {
    default "";
    # Any localhost/127.0.0.1 port in development, plus the configured site URL.
    "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}

server {
    listen 8000;
    server_name _;

    client_max_body_size 50m;

    # Applied to every location below.
    set $cors_headers "authorization, apikey, content-type, x-client-info, x-upsert, cache-control, x-requested-with, range, prefer, accept-profile, content-profile";

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers "content-range, content-length, x-upsert" always;
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers "content-range, content-length" always;
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /storage/v1/ {
        # This is the one that was silently breaking every upload.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers "content-range, content-length, x-upsert" always;
        proxy_pass http://storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        # Large uploads stream rather than buffering to disk first.
        proxy_request_buffering off;
    }

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
